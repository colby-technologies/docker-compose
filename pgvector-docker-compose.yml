version: '3.8'
services:
  pgvector-db:
   image: "pgvector/pgvector:pg16"
   container_name: "pgvector-local"
   volumes:
      - C:\Dev\pgvector\data:/var/lib/postgresql/data
      - C:\Dev\pgvector\initdb:/docker-entrypoint-initdb.d:ro
      #C:\Dev\pgvector\initdb
   ports:
      - 5434:5432
   environment:
      - POSTGRES_DB=vectordb
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=en_US.utf8"
      - TZ=America/Chicago # Example of setting a timezone