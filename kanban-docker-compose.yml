version: '3'
services:
  iota-db:
   image: "postgres:9.6-alpine"
   container_name: "iota-postgres"
   volumes:
      - C:\Dev\postgres\data:/var/lib/postgresql/data
   ports:
      - 5434:5432
   environment:
      - POSTGRES_DB=iotadb
      - POSTGRES_USER=iotausr
      - POSTGRES_PASSWORD=iota
      - POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=en_US.utf8"
      - TZ=America/Chicago # Example of setting a timezone

